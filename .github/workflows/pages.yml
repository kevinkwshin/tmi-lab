name: Publish TMI-lab
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 1'
    - cron: '17 0 * * 0,2-6'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scholar_refresh: ${{ steps.scholar.outcome }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh ORCID-linked publications
        id: publications
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 0 * * 1')
        continue-on-error: true
        run: npm run update:publications
      - name: Report preserved publication list
        if: steps.publications.outcome == 'failure'
        run: |
          echo '::warning title=Publication refresh unavailable::Using the last verified publication list; site checks and deployment will continue.'
          echo '### Publication refresh unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'The DOI registry could not be verified. The saved publication list is unchanged. See the refresh step for details.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh public Scholar metrics
        id: scholar
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run update:scholar
      - name: Report preserved Scholar snapshot
        if: steps.scholar.outcome == 'failure'
        run: |
          echo '::warning title=Scholar refresh unavailable::Using the last verified Scholar snapshot. Citation counts and the checked date are unchanged; site checks and deployment will continue.'
          echo 'The site keeps the last verified Scholar snapshot. The next daily run will make a new collection attempt. The Scholar refresh health check will report this failure after deployment.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kevinkwshin.github.io/tmi-lab/' }}
      - name: Save verified research snapshots
        if: steps.scholar.outcome == 'success' || steps.publications.outcome == 'success'
        run: |
          if ! git diff --quiet -- src/scholar-metrics.json src/publications-auto.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/scholar-metrics.json src/publications-auto.json
            git commit -m 'Update verified research snapshots' -m 'Preserve each saved snapshot on collection failure. Validated with syntax checks, unit tests and a bilingual build.'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  scholar-refresh-health:
    name: Verify Scholar refresh
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.scholar_refresh == 'failure' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report failed refresh after deployment
        run: |
          echo '::error title=Scholar refresh failed::The website was deployed with the last verified citation data. See the Scholar refresh annotation and build summary for the collection error. A new attempt is scheduled for the next day.'
          exit 1
