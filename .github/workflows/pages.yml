name: Publish TMI-lab
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh public Scholar metrics
        id: scholar
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run update:scholar
      - name: Report preserved Scholar snapshot
        if: steps.scholar.outcome == 'failure'
        run: |
          echo '::warning title=Scholar refresh unavailable::Using the last verified Scholar snapshot. Citation counts and the checked date are unchanged; site checks and deployment will continue.'
          echo '### Scholar refresh unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'The public profile could not be verified. The site uses the last verified snapshot and its original checked date. See the refresh step for the error; a later scheduled or manual run can try again.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kevinkwshin.github.io/tmi-lab/' }}
      - name: Save verified Scholar snapshot
        if: steps.scholar.outcome == 'success'
        run: |
          if ! git diff --quiet -- src/scholar-metrics.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/scholar-metrics.json
            git commit -m 'Keep citation evidence current' -m 'Constraint: Refresh one public profile; preserve the last snapshot on failure.' -m 'Confidence: high' -m 'Scope-risk: narrow' -m 'Tested: Scholar parser validation, unit tests, syntax checks and bilingual build.'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
